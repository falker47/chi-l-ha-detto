name: Keep Supabase Alive

# Supabase free tier mette in pausa progetti inattivi dopo 7 giorni.
# Una SELECT non basta a resettare il timer — serve attività di SCRITTURA.
# Questo workflow fa un INSERT su una tabella dedicata `pings` ogni 2 giorni.

on:
  schedule:
    # 09:00 UTC ogni 2 giorni (margine di sicurezza ampio sui 7)
    - cron: '0 9 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keep-alive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/pings" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "HTTP $RESPONSE"
          cat response.json 2>/dev/null || true
          if [ "$RESPONSE" != "201" ]; then
            echo "::error::Supabase INSERT failed with status $RESPONSE"
            exit 1
          fi
          echo "::notice::Keep-alive row inserted successfully"
